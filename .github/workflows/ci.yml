name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Generates server/generated/chatPrompt.generated.ts (gitignored),
      # which lint/typecheck/tests all import.
      - run: npm run build-chat-prompt

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
